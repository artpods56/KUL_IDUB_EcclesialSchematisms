[project]
name = "notarius-workspace"
version = "0.1.0"
description = "Notarius typed artifact-graph workbench"
requires-python = "==3.12.9"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "notarius-api",
    "notarius-core",
    "notarius-persistence",
    "notarius-storage",
]

[project.optional-dependencies]
ocr = ["notarius-plugin-ocr"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "plugins/ocr",
    "apps/api",
]

[tool.uv.sources]
notarius-api = { workspace = true }
notarius-core = { workspace = true }
notarius-persistence = { workspace = true }
notarius-plugin-ocr = { workspace = true }
notarius-storage = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.36.2",
    "httpx>=0.28.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "libs/core/src/notarius_core/artifacts.py",
    "libs/core/src/notarius_core/conversions.py",
    "libs/core/src/notarius_core/application",
    "libs/core/src/notarius_core/domain/materialized_outputs.py",
    "libs/core/src/notarius_core/domain/saved_graphs.py",
    "libs/core/src/notarius_core/nodes.py",
    "libs/core/src/notarius_core/domain/errors.py",
    "libs/core/src/notarius_core/operators",
    "libs/core/src/notarius_core/plugins.py",
    "libs/core/src/notarius_core/ports/storage.py",
    "libs/core/src/notarius_core/ports/materialized_outputs.py",
    "libs/core/src/notarius_core/ports/saved_graphs.py",
    "libs/core/src/notarius_core/runtime",
    "libs/storage/src/notarius_storage",
    "libs/persistence/src/notarius_persistence",
    "infra/db/migrations",
    "apps/api/src/notarius_api/builtins.py",
    "apps/api/src/notarius_api/main.py",
    "apps/api/src/notarius_api/openapi.py",
    "apps/api/src/notarius_api/plugin_discovery.py",
    "apps/api/src/notarius_api/schemas/saved_graphs.py",
    "apps/api/src/notarius_api/schemas/workbench.py",
    "apps/api/src/notarius_api/settings.py",
    "apps/api/src/notarius_api/services/workbench.py",
    "apps/api/src/notarius_api/v1/routes/saved_graphs.py",
    "apps/api/src/notarius_api/v1/routes/workbench.py",
    "plugins/ocr/src/notarius_plugin_ocr",
    "tests/unit/core/test_invocation.py",
    "tests/unit/core/test_mistral_ocr.py",
    "tests/unit/core/test_node_contracts.py",
    "tests/unit/core/test_plugins.py",
    "tests/unit/core/test_sources.py",
    "tests/unit/core/test_tables.py",
    "tests/unit/core/test_text.py",
    "tests/unit/core/test_saved_graphs.py",
    "tests/unit/application/test_saved_graphs.py",
    "tests/unit/persistence/test_saved_graph_persistence.py",
    "tests/unit/persistence/test_materialized_output_persistence.py",
    "tests/unit/persistence/test_migrations.py",
    "tests/unit/storage",
    "tests/unit/api/test_saved_graphs.py",
    "tests/unit/api/test_settings.py",
    "tests/unit/api/test_arithmetic.py",
    "tests/unit/api/test_mistral_ocr_provider.py",
    "tests/unit/api/test_openapi.py",
    "tests/unit/api/test_plugin_discovery.py",
    "tests/unit/api/test_routes.py",
    "tests/unit/api/test_text.py",
    "tests/unit/plugins/test_ocr_plugin.py",
    "tests/unit/architecture/test_import_boundaries.py",
    "scripts/smoke_workbench.py",
]
exclude = [
    ".venv",
    ".notarius-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "plugins/ocr/src",
        "apps/api/src",
    ] },
]
