[project]
name = "notarius-workspace"
version = "0.1.0"
description = "Notarius prototype workspace"
requires-python = "==3.12.9"
dependencies = [
    "notarius-api",
    "notarius-core",
    "notarius-storage",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/storage",
    "apps/api",
]

[tool.uv.sources]
notarius-api = { workspace = true }
notarius-core = { workspace = true }
notarius-storage = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.36.2",
    "httpx>=0.28.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "libs/core/src/notarius_core/prototype",
    "libs/core/src/notarius_core/domain/errors.py",
    "libs/core/src/notarius_core/ports/storage.py",
    "libs/storage/src/notarius_storage",
    "apps/api/src/notarius_api/main.py",
    "apps/api/src/notarius_api/prototype_openapi.py",
    "apps/api/src/notarius_api/schemas/prototype.py",
    "apps/api/src/notarius_api/services/mistral_ocr.py",
    "apps/api/src/notarius_api/services/prototype_workbench.py",
    "apps/api/src/notarius_api/v1/routes/prototype.py",
    "tests/unit/core/test_prototype_mistral_ocr.py",
    "tests/unit/core/test_prototype_node_contracts.py",
    "tests/unit/core/test_prototype_sources.py",
    "tests/unit/core/test_prototype_tables.py",
    "tests/unit/api/test_mistral_ocr_provider.py",
    "tests/unit/api/test_prototype_arithmetic.py",
    "tests/unit/api/test_prototype_openapi.py",
    "tests/unit/api/test_prototype_routes.py",
    "tests/unit/architecture/test_import_boundaries.py",
    "scripts/smoke_prototype.py",
]
exclude = [
    ".venv",
    ".notarius-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/core/src",
        "libs/storage/src",
        "apps/api/src",
    ] },
]
