[project]
name = "notarius-workspace"
version = "0.1.0"
description = "Notarius typed artifact-graph workbench"
requires-python = "==3.12.9"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "notarius-api",
    "notarius-core",
    "notarius-mcp",
    "notarius-persistence",
    "notarius-storage",
]

[project.optional-dependencies]
gis = ["notarius-plugin-gis"]
llm = ["notarius-plugin-llm"]
ocr = ["notarius-plugin-ocr"]
sql = ["notarius-plugin-sql"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "plugins/llm",
    "plugins/ocr",
    "plugins/gis",
    "plugins/sql",
    "apps/api",
    "apps/mcp",
]

[tool.uv.sources]
notarius-api = { workspace = true }
notarius-core = { workspace = true }
notarius-mcp = { workspace = true }
notarius-persistence = { workspace = true }
notarius-plugin-llm = { workspace = true }
notarius-plugin-ocr = { workspace = true }
notarius-plugin-gis = { workspace = true }
notarius-plugin-sql = { workspace = true }
notarius-storage = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.36.2",
    "httpx>=0.28.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "libs/core/*",
    "libs/persistence/*",
    "libs/storage/*",
    "plugins/llm/*",
    "plugins/ocr/*",
    "plugins/gis/*",
    "plugins/sql/*",
    "apps/api/*",
    "apps/mcp/*",
]
exclude = [
    ".venv",
    ".notarius-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "plugins/llm/src",
        "plugins/ocr/src",
        "plugins/gis/src",
        "plugins/sql/src",
        "apps/api/src",
        "apps/mcp/src",
    ] },
]
