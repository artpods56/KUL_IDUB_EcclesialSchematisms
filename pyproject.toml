[project]
name = "grafy-workspace"
version = "0.1.0"
description = "Grafy typed artifact-graph workbench"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "grafy-api",
    "grafy-core",
    "grafy-persistence",
    "grafy-plugin-arithmetic",
    "grafy-plugin-image",
    "grafy-plugin-prompt",
    "grafy-plugin-schema",
    "grafy-plugin-sequence",
    "grafy-plugin-table",
    "grafy-plugin-text",
    "grafy-storage",
]

[project.optional-dependencies]
gis = ["grafy-plugin-gis"]
llm = ["grafy-plugin-llm"]
ocr = ["grafy-plugin-ocr"]
sql = ["grafy-plugin-sql"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/persistence",
    "libs/storage",
    "apps/api",
]
exclude = [
    "examples/plugin-notes",
    "plugins/arithmetic",
    "plugins/gis",
    "plugins/image",
    "plugins/llm",
    "plugins/ocr",
    "plugins/prompt",
    "plugins/schema",
    "plugins/sequence",
    "plugins/sql",
    "plugins/table",
    "plugins/text",
]

[tool.uv.sources]
grafy-api = { workspace = true }
grafy-core = { workspace = true }
grafy-persistence = { workspace = true }
grafy-plugin-arithmetic = { path = "plugins/arithmetic" }
grafy-plugin-image = { path = "plugins/image" }
grafy-plugin-llm = { path = "plugins/llm" }
grafy-plugin-ocr = { path = "plugins/ocr" }
grafy-plugin-prompt = { path = "plugins/prompt" }
grafy-plugin-schema = { path = "plugins/schema" }
grafy-plugin-gis = { path = "plugins/gis" }
grafy-plugin-sql = { path = "plugins/sql" }
grafy-plugin-sequence = { path = "plugins/sequence" }
grafy-plugin-table = { path = "plugins/table" }
grafy-plugin-text = { path = "plugins/text" }
grafy-storage = { workspace = true }

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "basedpyright>=1.36.2",
    "httpx>=0.28.0",
    "polyfactory>=3.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
    "ty>=0.0.74",
]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "libs/core/*",
    "libs/persistence/*",
    "libs/storage/*",
    "plugins/arithmetic/*",
    "plugins/image/*",
    "plugins/prompt/*",
    "plugins/schema/*",
    "plugins/text/*",
    "plugins/sequence/*",
    "plugins/table/*",
    "plugins/llm/*",
    "plugins/ocr/*",
    "plugins/gis/*",
    "plugins/sql/*",
    "apps/api/*",
    "tests/*",
]
exclude = [
    "**/.venv",
    "**/build",
    "**/dist",
    ".grafy-artifacts",
    ".playwright-cli",
    "apps/web",
]
executionEnvironments = [
    { root = ".", extraPaths = [
        "libs/core/src",
        "libs/persistence/src",
        "libs/storage/src",
        "plugins/arithmetic/src",
        "plugins/image/src",
        "plugins/prompt/src",
        "plugins/schema/src",
        "plugins/text/src",
        "plugins/sequence/src",
        "plugins/table/src",
        "plugins/llm/src",
        "plugins/ocr/src",
        "plugins/gis/src",
        "plugins/sql/src",
        "apps/api/src",
    ] },
]
