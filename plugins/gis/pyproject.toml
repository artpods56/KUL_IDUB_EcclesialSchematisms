[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-plugin-gis"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "notarius-core",
    "pydantic",
]

[project.entry-points."notarius.plugins"]
gis = "notarius_plugin_gis.plugin:GIS"

[tool.uv.sources]
notarius-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
