[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-plugin-llm"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "mistralai>=2.6.0",
    "notarius-core",
    "openai>=2.0.0",
    "pydantic",
]

[project.entry-points."notarius.plugins"]
llm = "notarius_plugin_llm.plugin:LLM"

[tool.uv.sources]
notarius-core = { workspace = true }

[tool.basedpyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
