[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-plugin-notarius"
version = "0.1.0"
description = "Managed structured image-dataset extraction for Grafy"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "grafy-core==0.1.0",
    "openai>=2.0.0",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
extends = "../../pyproject.toml"
venvPath = "."
venv = ".venv"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
