services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api-ocr
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      NOTARIUS_CORS_ORIGINS: ${NOTARIUS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      NOTARIUS_WORKSPACE: /data/workbench
    volumes:
      - notarius-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_NOTARIUS_API_URL: ${NEXT_PUBLIC_NOTARIUS_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_NOTARIUS_API_URL: ${NEXT_PUBLIC_NOTARIUS_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  notarius-data:
