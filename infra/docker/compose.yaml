name: notarius

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: "10m"

x-persistence-environment: &persistence-environment
  NOTARIUS_DATABASE_URL: ${NOTARIUS_DOCKER_DATABASE_URL:-sqlite+aiosqlite:////data/workbench/notarius.sqlite3}
  NOTARIUS_WORKSPACE: /data/workbench

x-api-environment: &api-environment
  <<: *persistence-environment
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  OPENAI_CUSTOM_HEADERS: ${OPENAI_CUSTOM_HEADERS:-}
  NOTARIUS_PUBLIC_ORIGIN: ${NOTARIUS_PUBLIC_ORIGIN:-https://notarius.example.com}
  NOTARIUS_CORS_ORIGINS: ${NOTARIUS_CORS_ORIGINS:-https://notarius.example.com}
  NOTARIUS_OIDC_ISSUER: ${NOTARIUS_OIDC_ISSUER:?NOTARIUS_OIDC_ISSUER must be set and non-empty}
  NOTARIUS_OIDC_CLIENT_ID: ${NOTARIUS_OIDC_CLIENT_ID:?NOTARIUS_OIDC_CLIENT_ID must be set and non-empty}
  # A null Compose value imports the variable when present and leaves it unset
  # for public PKCE clients that do not have a client secret.
  NOTARIUS_OIDC_CLIENT_SECRET:
  NOTARIUS_OIDC_ALLOWED_SIGNING_ALGORITHMS: ${NOTARIUS_OIDC_ALLOWED_SIGNING_ALGORITHMS:-["RS256"]}
  NOTARIUS_OIDC_AUTH_WRAPPING_KEY: ${NOTARIUS_OIDC_AUTH_WRAPPING_KEY:?NOTARIUS_OIDC_AUTH_WRAPPING_KEY must be set and non-empty}
  NOTARIUS_OIDC_AUTH_WRAPPING_KEY_VERSION: ${NOTARIUS_OIDC_AUTH_WRAPPING_KEY_VERSION:-1}
  NOTARIUS_CREDENTIAL_ENCRYPTION_KEY: ${NOTARIUS_CREDENTIAL_ENCRYPTION_KEY:?NOTARIUS_CREDENTIAL_ENCRYPTION_KEY must be set and non-empty}
  NOTARIUS_COMMAND_HMAC_KEY: ${NOTARIUS_COMMAND_HMAC_KEY:?NOTARIUS_COMMAND_HMAC_KEY must be set and non-empty}
  NOTARIUS_COMMAND_HMAC_KEY_VERSION: ${NOTARIUS_COMMAND_HMAC_KEY_VERSION:-1}
  NOTARIUS_REQUIRE_SINGLE_API_OWNER: "true"
  NOTARIUS_EXECUTION_BACKEND: ${NOTARIUS_EXECUTION_BACKEND:-prefect}
  NOTARIUS_MAP_MAX_CONCURRENCY: ${NOTARIUS_MAP_MAX_CONCURRENCY:-4}
  NOTARIUS_MAX_ACTIVE_EXECUTIONS: ${NOTARIUS_MAX_ACTIVE_EXECUTIONS:-2}
  NOTARIUS_STORAGE_BACKEND: ${NOTARIUS_STORAGE_BACKEND:-local}
  NOTARIUS_STORAGE_BUCKET: ${NOTARIUS_STORAGE_BUCKET:-workbench-artifacts}
  NOTARIUS_STAGED_UPLOAD_MAX_BYTES: ${NOTARIUS_STAGED_UPLOAD_MAX_BYTES:-67108864}
  FORWARDED_ALLOW_IPS: ${NOTARIUS_DOCKER_SUBNET:-172.30.0.0/24}
  NOTARIUS_S3_ENDPOINT_URL: ${NOTARIUS_S3_ENDPOINT_URL:-}
  NOTARIUS_S3_REGION: ${NOTARIUS_S3_REGION:-us-east-1}
  NOTARIUS_S3_ACCESS_KEY_ID: ${NOTARIUS_S3_ACCESS_KEY_ID:-}
  NOTARIUS_S3_SECRET_ACCESS_KEY: ${NOTARIUS_S3_SECRET_ACCESS_KEY:-}
  NOTARIUS_S3_FORCE_PATH_STYLE: ${NOTARIUS_S3_FORCE_PATH_STYLE:-false}
  PREFECT_API_URL: http://prefect:4200/api
  PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
  # Collaboration assumes one Uvicorn process with one worker.
  WEB_CONCURRENCY: "1"

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: *persistence-environment
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - notarius-data:/data

  prefect:
    image: prefecthq/prefect:3.6.21-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://127.0.0.1:4200/api}
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - prefect-data:/root/.prefect
    ports:
      - "${NOTARIUS_BIND_ADDRESS:-127.0.0.1}:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api-plugins
    environment: *api-environment
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    volumes:
      - notarius-data:/data
    # No host ports: the same-origin gateway is the only Notarius public listener.
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    init: true
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NOTARIUS_BIND_ADDRESS:-127.0.0.1}:${NOTARIUS_GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  notarius-data:
  prefect-data:

networks:
  default:
    name: ${NOTARIUS_DOCKER_NETWORK:-notarius-internal}
    ipam:
      config:
        - subnet: ${NOTARIUS_DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${NOTARIUS_DOCKER_GATEWAY:-172.30.0.1}
