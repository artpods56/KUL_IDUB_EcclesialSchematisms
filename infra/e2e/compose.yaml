services:
  migrate:
    user: "${GRAFY_E2E_HOST_UID:?GRAFY_E2E_HOST_UID must be set}:${GRAFY_E2E_HOST_GID:?GRAFY_E2E_HOST_GID must be set}"
    environment:
      GRAFY_DATABASE_URL: "sqlite+aiosqlite:///${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}/grafy.sqlite3"
      GRAFY_WORKSPACE: "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"
    volumes:
      - "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}:${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"

  bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api-plugins
    entrypoint: ["/bin/sh", "/opt/grafy-e2e/bootstrap-entrypoint.sh"]
    command: []
    working_dir: /tmp
    environment:
      GRAFY_DATABASE_URL: "sqlite+aiosqlite:///${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}/grafy.sqlite3"
      GRAFY_WORKSPACE: "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"
      GRAFY_PLUGIN_ROOTS: '["/app/plugins"]'
      GRAFY_PLUGIN_RUNTIME_ENABLED: "true"
      GRAFY_PLUGIN_RUNTIME_PROFILE: python-uv
      GRAFY_PLUGIN_DOCKER_BINARY: /usr/local/bin/docker
      GRAFY_PLUGIN_EGRESS_BROKER_IMAGE: "${GRAFY_E2E_BROKER_IMAGE:?GRAFY_E2E_BROKER_IMAGE must be set}"
      GRAFY_NETWORK_POLICY_MANIFEST: /etc/grafy/e2e-network-policy.toml
      GRAFY_STORAGE_BACKEND: local
      GRAFY_STORAGE_BUCKET: workbench-artifacts
      GRAFY_E2E_PAT_FILE: /run/grafy-e2e/workspace.pat
      GRAFY_E2E_SYSTEM_PLUGIN_DEPLOYMENT_MANIFEST: "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}/system-plugin-deployment.json"
      GRAFY_E2E_HOST_UID: "${GRAFY_E2E_HOST_UID:?GRAFY_E2E_HOST_UID must be set}"
      GRAFY_E2E_HOST_GID: "${GRAFY_E2E_HOST_GID:?GRAFY_E2E_HOST_GID must be set}"
      GRAFY_E2E_DOCKER_GID: "${GRAFY_E2E_DOCKER_GID:?GRAFY_E2E_DOCKER_GID must be set}"
      DOCKER_CONFIG: /tmp/grafy-e2e-docker
      UV_CACHE_DIR: /tmp/.uv_cache
      UV_PYTHON_PREFERENCE: only-system
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - "${GRAFY_E2E_DOCKER_SOCKET:?GRAFY_E2E_DOCKER_SOCKET must be set}:/var/run/docker.sock"
      - "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}:${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"
      - "${GRAFY_E2E_CONTROL_ROOT:?GRAFY_E2E_CONTROL_ROOT must be set}:/run/grafy-e2e"
      - ../e2e/bootstrap-entrypoint.sh:/opt/grafy-e2e/bootstrap-entrypoint.sh:ro
      - ../e2e/bootstrap.py:/opt/grafy-e2e/bootstrap.py:ro
      - ../e2e/network-policy.toml:/etc/grafy/e2e-network-policy.toml:ro
      - ../e2e/tls/ca.crt:/etc/grafy/e2e-ca.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  openai-e2e:
    image: grafy-openai-e2e:local
    build:
      context: ../..
      dockerfile: infra/e2e/openai-provider.Dockerfile
    cap_drop:
      - ALL
    init: true
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8388608,mode=1777
    ports:
      - "18443:8443"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl.create_default_context(cafile='/opt/grafy-e2e-provider/tls/server.crt'), timeout=1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    user: "${GRAFY_E2E_HOST_UID:?GRAFY_E2E_HOST_UID must be set}:${GRAFY_E2E_HOST_GID:?GRAFY_E2E_HOST_GID must be set}"
    group_add:
      - "${GRAFY_E2E_DOCKER_GID:?GRAFY_E2E_DOCKER_GID must be set}"
    environment:
      GRAFY_DATABASE_URL: "sqlite+aiosqlite:///${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}/grafy.sqlite3"
      GRAFY_WORKSPACE: "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"
      GRAFY_AUTH_COOKIE_SECURE: "false"
      GRAFY_PLUGIN_ROOTS: '["/app/plugins"]'
      GRAFY_PLUGIN_RUNTIME_ENABLED: "true"
      GRAFY_PLUGIN_RUNTIME_PROFILE: python-uv
      GRAFY_PLUGIN_DOCKER_BINARY: /usr/local/bin/docker
      GRAFY_PLUGIN_EGRESS_BROKER_IMAGE: "${GRAFY_E2E_BROKER_IMAGE:?GRAFY_E2E_BROKER_IMAGE must be set}"
      GRAFY_NETWORK_POLICY_MANIFEST: /etc/grafy/e2e-network-policy.toml
      GRAFY_SYSTEM_PLUGIN_DEPLOYMENT_MANIFEST: "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}/system-plugin-deployment.json"
      GRAFY_STORAGE_BACKEND: local
      GRAFY_STORAGE_BUCKET: workbench-artifacts
      DOCKER_CONFIG: /tmp/grafy-e2e-docker
    ports:
      - "127.0.0.1:${GRAFY_E2E_API_PORT:-18080}:8000"
    extra_hosts:
      - grafy-e2e-provider:host-gateway
    volumes:
      - "${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}:${GRAFY_E2E_WORKSPACE_ROOT:?GRAFY_E2E_WORKSPACE_ROOT must be set}"
      - ../e2e/network-policy.toml:/etc/grafy/e2e-network-policy.toml:ro
      - ../e2e/tls/ca.crt:/etc/grafy/e2e-ca.crt:ro
      - "${GRAFY_E2E_DOCKER_SOCKET:?GRAFY_E2E_DOCKER_SOCKET must be set}:/var/run/docker.sock"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      openai-e2e:
        condition: service_healthy
