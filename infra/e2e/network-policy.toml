schema_version = 1

[defaults]
plugin-execution = "offline"

[profiles.plugin-execution.e2e-provider]
mode = "curated"
public_address_only = false
https_only = true
allowed_origins = ["https://grafy-e2e-provider:18443"]
ca_bundle_path = "/etc/grafy/e2e-ca.crt"

[[assignments]]
plane = "plugin-execution"
scope = "system"
slug = "external.llm"
profile = "e2e-provider"
