services:
  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm-database:latest}
    container_name: llm-stack-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - /opt/llm-stack/litellm.yaml:/app/config.yaml:ro
      - /var/lib/llm-stack/litellm:/var/lib/llm-stack/litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    networks:
      - llm-stack

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: llm-stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
    volumes:
      - /var/lib/llm-stack/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - llm-stack

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: llm-stack-vllm
    restart: unless-stopped
    ipc: host
    gpus: all
    environment:
      HF_HOME: /data/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - /var/lib/llm-stack/huggingface:/data/huggingface
      - /var/lib/llm-stack/vllm:/root/.cache/vllm
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--model"
      - "google/gemma-4-31B-it"
      - "--served-model-name"
      - "gemma-4-31b-it"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--max-model-len"
      - "32768"
      - "--language-model-only"
      - "--enforce-eager"
    networks:
      - llm-stack

networks:
  llm-stack:
    name: llm-stack
