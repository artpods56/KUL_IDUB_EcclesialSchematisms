[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafy-client"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "grafy-core",
    "httpx>=0.28.0",
    "pydantic",
]

[tool.pyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
