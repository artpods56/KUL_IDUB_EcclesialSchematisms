[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-storage"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "notarius-core",
    "obstore>=0.9.3",
]

[tool.uv.sources]
notarius-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
