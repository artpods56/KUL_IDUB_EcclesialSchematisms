[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-shared"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "pydantic",
    "structlog",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

