[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-llm"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "notarius-core",
    "notarius-shared",
    "openai",
    "pydantic",
    "tenacity>=9.0.0",
]

[tool.uv.sources]
notarius-core = { workspace = true }
notarius-shared = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

