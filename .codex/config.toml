[mcp_servers.grafy]
url = "http://127.0.0.1:8000/mcp"
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 60

# Provide Authorization: Bearer <workspace-bound PAT> through the Codex MCP
# client auth settings for this server. Do not commit a live PAT.

[mcp_servers.grafy.tools.create_graph]
approval_mode = "prompt"

[mcp_servers.grafy.tools.replace_graph]
approval_mode = "prompt"

[mcp_servers.grafy.tools.submit_graph_command]
approval_mode = "prompt"
