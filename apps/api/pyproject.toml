[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-api"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "authlib>=1.7.2",
    "cryptography>=45.0.0",
    "fastapi>=0.123.0",
    "httpx>=0.28.0",
    "notarius-core",
    "notarius-mcp",
    "notarius-persistence",
    "notarius-storage",
    "pillow",
    "prefect==3.6.21",
    "pydantic",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "starlette<1.0.0",
    "truststore>=0.10.4",
    "uvicorn>=0.38.0",
]

[project.scripts]
notarius-admin = "notarius_api.admin:main"

[tool.uv.sources]
notarius-core = { workspace = true }
notarius-mcp = { workspace = true }
notarius-persistence = { workspace = true }
notarius-storage = { workspace = true }

[tool.basedpyright]
extends = "../../pyproject.toml"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
