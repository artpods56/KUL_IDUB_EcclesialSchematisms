[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notarius-worker"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
    "faststream[nats]>=0.6.0",
    "httpx",
    "jinja2",
    "jsonschema",
    "notarius-core",
    "notarius-messaging",
    "notarius-persistence",
    "notarius-shared",
    "notarius-storage",
    "pillow",
    "pydantic",
    "pytesseract",
]

[tool.uv.sources]
notarius-core = { workspace = true }
notarius-messaging = { workspace = true }
notarius-persistence = { workspace = true }
notarius-shared = { workspace = true }
notarius-storage = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
