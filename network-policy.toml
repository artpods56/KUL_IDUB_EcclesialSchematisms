schema_version = 1

# Allow the globally published LLM Plugin to contact the public HTTPS origin
# supplied through its declared base_url configuration field. The current
# policy schema calls globally published Plugins "system" scoped.
[profiles.plugin-execution.configured-public]
mode = "configured-public"
public_address_only = true
https_only = true
max_origins_per_execution = 1

[[assignments]]
plane = "plugin-execution"
scope = "system"
slug = "external.llm"
profile = "configured-public"
